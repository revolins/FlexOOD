# Environment used for every number in the paper: versions as imported at run time (torch built for CUDA 12.6; the PyG
# extensions are the pt27 / cu128 wheels, the combination the paper's runs used).
name: flex
channels:
  - conda-forge
dependencies:
  - python=3.10.14
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - --find-links https://data.pyg.org/whl/torch-2.7.0+cu128.html
      - torch==2.7.1
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - torch-cluster==1.6.3
      - pyg-lib==0.4.0
      - ogb==1.3.6
      - numpy==2.2.6
      - scipy==1.15.2
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - networkx==3.4.2
      - pyyaml==6.0.2
      - tqdm==4.67.1
      - numba==0.65.1        # ogbl-collab pair features
      - pot==0.9.5           # GI-Graph (fused Gromov-Wasserstein)
      - pytest==8.4.2
